<form action="/submit" method="get">
  <h2>WiFi Configuration</h2>
  <label for="wifi_name">WiFi Name (SSID):</label
  ><input type="text" id="wifi_name" name="wifi_name" required /><br><label
    for="wifi_password"
    >WiFi Password:</label
  ><input
    type="password"
    id="wifi_password"
    name="wifi_password"
    required
  /><br><label for="ip_address">Server:</label
  ><input type="text" id="server" name="server" required /><br><label for="port"
    >Port:</label
  ><input type="number" id="port" name="port" required /><br><label for="token"
    >Token:</label
  ><input type="text" id="token" name="token" required /><br><label
    for="device_name"
    >Room Name:</label
  ><input type="text" id="device_name" name="device_name" required /><br>
  <input type="submit" value="Submit" />
</form>
